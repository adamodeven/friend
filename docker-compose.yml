version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: friend-api
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.2:1b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:13b}
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - friend_data:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT:-8000} --proxy-headers --forwarded-allow-ips='*'"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: friend-worker
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.2:1b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:13b}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - friend_data:/data
    command: celery -A app.worker.celery_app.celery_app worker -l INFO -Ofair --concurrency=${WORKER_CONCURRENCY:-1} --prefetch-multiplier=1

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: friend-beat
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.2:1b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:13b}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - friend_data:/data
    command: celery -A app.worker.celery_app.celery_app beat -l INFO

  postgres:
    image: postgres:16
    container_name: friend-postgres
    environment:
      POSTGRES_USER: friend
      POSTGRES_PASSWORD: friend
      POSTGRES_DB: friend
    ports:
      - "5432:5432"
    volumes:
      - friend_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: friend-redis
    ports:
      - "6379:6379"
    volumes:
      - friend_redis:/data

  ollama:
    image: ollama/ollama:latest
    container_name: friend-ollama
    ports:
      - "11434:11434"
    volumes:
      - friend_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    container_name: friend-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.2:1b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:13b}
      OLLAMA_PULL_VISION_ON_STARTUP: ${OLLAMA_PULL_VISION_ON_STARTUP:-false}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo "pulling ollama text model: ${OLLAMA_TEXT_MODEL}"
        ollama pull "${OLLAMA_TEXT_MODEL}"
        if [ "${OLLAMA_PULL_VISION_ON_STARTUP}" = "true" ] && [ "${OLLAMA_VISION_MODEL}" != "${OLLAMA_TEXT_MODEL}" ]; then
          echo "pulling ollama vision model: ${OLLAMA_VISION_MODEL}"
          ollama pull "${OLLAMA_VISION_MODEL}"
        else
          echo "skipping vision model pre-pull (set OLLAMA_PULL_VISION_ON_STARTUP=true to enable)"
        fi
        echo "ollama models ready"
    restart: "no"

volumes:
  friend_pg:
  friend_redis:
  friend_data:
  friend_ollama:
